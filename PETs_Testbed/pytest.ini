[pytest]
testpaths = tests
markers =
    perf: performance benchmarks (deselected by default; run with -m perf)
    slow: long-running tests
    integration: tests spanning multiple modules or the filesystem
# Performance benchmarks are excluded from the default run so the unit suite
# stays fast. Run them explicitly with `-m perf`, which overrides this default.
addopts = -m "not perf"
